server {
        listen 80;
        listen 443 ssl;
        server_name dani.test www.dani.test;
        root /var/www/dani.test/html;
        ssl_certificate /etc/ssl/certs/dani.test.pem;
        ssl_certificate_key /etc/ssl/private/dani.test.key;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        index index.html index.htm index.nginx-debian.html;
        location / {
                try_files $uri $uri/ =404;
        }
}